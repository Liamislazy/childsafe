[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "childsafe"
version = "0.1.0"
description = "Child dangerous-object warning system: ChildSUn classifier + webcam hand/object-to-mouth monitoring + rule-based alerts"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
