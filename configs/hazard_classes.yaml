# Annotation targets, NOT a claim that installed weights recognize these classes.
# Local custom detector must use these exact names. Do not map a whole toy to a
# small fragment or a remote control to an exposed battery.
names:
  0: knife
  1: fork
  2: scissors
  3: pen
  4: pencil
  5: chopsticks
  6: coin
  7: button_battery
  8: cylindrical_battery
  9: screw
  10: nail
  11: safety_pin
  12: needle
  13: marble
  14: small_toy_piece
scope: Potentially hazardous objects near the mouth in images; no physical size or choking diagnosis.
