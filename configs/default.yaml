# Central config. Every threshold here is a starting value, NOT a tuned result.
# Tune D3 thresholds with evaluate_alerts.py grid --sessions <root> --split dev,
# and report on the held-out test split only.

paths:
  raw_data: data/raw/childsun          # extracted ChildSUn root
  splits: data/splits/splits.csv
  hashes: data/splits/hashes.npz
  outputs: outputs
  docs: docs                           # generated reports (dataset, split, results)
  face_model: models/face_landmarker.task
  hand_model: models/hand_landmarker.task

# Category name (folder name, or filename prefix for the flat ChildSUn layout; normalized:
# lowercase, no spaces/_/-) -> binary label. Grouping checked against the Kaggle dataset
# description (2026-10-01): unsafe = knives, sockets, scissors, electric heaters, forks;
# safe = toys, baby items, fruits (spoon and ball are not named there; kept safe).
label_map:
  knife: unsafe
  socket: unsafe
  sockets: unsafe
  scissors: unsafe
  scissor: unsafe
  seissor: unsafe     # typo used in ChildSUn filenames
  electricheater: unsafe
  heater: unsafe
  fork: unsafe
  toy: safe
  toys: safe
  ball: safe
  babyitems: safe
  babyitem: safe
  fruit: safe
  fruits: safe
  spoon: safe
  # objects outside the 10 ChildSUn classes (Open Images pen, phone, mug, hand...). "safe" here only means
  # "not an unsafe class" for P(unsafe); it is not a safety claim (a pen cap is a choking hazard).
  other: safe
  # if the dataset is already organised as safe/ and unsafe/ folders:
  safe: safe
  unsafe: unsafe

# Merge spelling variants into one class name.
# socket/sockets are separate filename sets in ChildSUn (86 + 124 source photos); merged here
# because the paper lists a single "socket" category.
category_aliases:
  sockets: socket
  seissor: scissors
  scissor: scissors
  fruits: fruit
  toys: toy
  babyitem: babyitems
  electricheater: heater

dedup:
  hash_size: 8              # 64-bit pHash / dHash
  phash_threshold: 8        # chosen by inspecting montages (docs/split_report.md): true dups have low dHash
  dhash_threshold: 5
  dihedral: true            # also compare flipped / 90-degree-rotated variants (catches flip/rotate augmentation)

split:
  test_frac: 0.15
  val_frac: 0.15
  seed: 42

train:
  img_size: 224
  batch_size: 32
  epochs: 25
  lr: 3.0e-4
  lr_overrides:             # VGG19 diverged at 3e-4 (best epoch 0 in the first runs)
    vgg19_bn: 5.0e-5
  weight_decay: 1.0e-4
  patience: 6
  num_workers: 4
  amp: true
  robust_aug: false         # A5: random erasing, motion blur, gamma, ISO noise
  models: [efficientnet_b0, mobilenetv3_large_100, vgg19_bn]

calibration:
  n_bins: 15
  reject_threshold: 0.70    # calibrated max prob below this -> "uncertain"

landmarks:
  normalizer: face_width    # face_width | inter_eye | hand_size (B1 compares all three)
  min_face_conf: 0.5
  min_hand_conf: 0.5
  num_hands: 2
  # Far people (person box shorter than zoom_below_frac of the frame) are cropped and enlarged up to
  # zoom_max_scale (longest side -> zoom_target_px) before MediaPipe; size checks use that resolution.
  zoom: true
  zoom_below_frac: 0.6
  zoom_target_px: 640
  zoom_max_scale: 3.0

smoothing:
  method: one_euro          # none | ema | one_euro
  ema_alpha: 0.4
  one_euro_min_cutoff: 1.0
  one_euro_beta: 0.05
  lost_hold_s: 0.8          # B2: hold last state this long when the mouth landmark disappears
  lost_max_s: 3.0           # legacy metadata only; runtime never extends held evidence beyond lost_hold_s

temporal:                   # D1
  window_s: 0.3333333333333333
  required_evidence_s: 0.1
  max_gap_s: 0.25
  dropout_grace_s: 0.3      # if confirmation returns within this time of the last confirmed frame, dwell resumes
                            # (paused, not reset; the missing interval is never added). 0 = old behaviour
  d_enter: 0.35             # normalized distance to enter "near" (hysteresis: enter < exit)
  d_exit: 0.50
  n_of_m: [3, 10]           # legacy metadata only; runtime uses the duration window above
  merge_s: 2.0              # merge events closer than this
  cooldown_s: 5.0           # limit repeat notifications; never lower displayed danger

cascade:                    # D2
  enabled: true
  d_far: 1.2                # run Module A only when normalized distance < d_far
  classify_every_n: 3       # and at most every N frames (cached in between)
  classify_interval_s: 0.1
  crop_scale: 2.2           # hand crop = hand bbox * scale

hazard_policy:
  # Explicit scope for high alerts: visible held sharp objects near the mouth in 2D.
  # Toy/fruit/spoon labels do not establish suitability, size or absence of fragments.
  # Socket/heater categories require different contextual detectors, not mouth rules.
  mouth_hazards: {knife: sharp_object, fork: pointed_object, scissors: sharp_object}

rules:                      # D3
  p_unsafe_danger: 0.60     # calibrated P(unsafe) needed for danger
  dwell_danger_s: 0.5       # near for at least this long before danger
  dwell_safe_caution_s: 3.0 # legacy CSV only; modern proximity requests caution regardless of category
  ttc_caution_s: 0.8        # unsafe object approaching with time-to-contact below this -> caution
  # YOLO misses most small held objects; then classify the area around the hand (original Module B).
  # Only a confident unsafe result counts as evidence (stricter than the 0.6 mask path). UNTUNED.
  hand_crop_fallback: true
  caution_hold_s: 1.5       # keep CAUTION through flickering evidence unless a departure is observed. UNTUNED
  hand_crop_min_p_unsafe: 0.8

runtime:
  cpu_threads: 0            # keep library defaults; optional measured CPU budget (training unaffected)
  max_people: 4
  primary_person_only: false # opt-in (--single-person): follow only the largest person; not for doll/child-next-to-adult tests
  identity_hold_s: 3.0       # retain model/ID across slow frames; does not extend risk evidence
  stale_frame_s: 0.25
  camera_index: 0
  width: 1280
  height: 720
  log_dir: outputs/events   # events only; video is never written

detector:
  weights: models/yolo11n-seg.pt
  min_conf: 0.5             # people
  # Objects: thin/small items (fork, knife, spoon) often score 0.3-0.5 with yolo11n. Objects below
  # quality.min_candidate_mask_conf are never used; between that and min_mask_conf they can only
  # raise CAUTION. UNTUNED starting value (2026-10-09): validate false alarms per hour on dev sessions.
  object_min_conf: 0.35
  device: auto              # GPU when available (yolo11n-seg ~13 ms on RTX 3050 vs ~72 ms on CPU)
  imgsz: 640
  # Second pass on a square crop around each person's hands + mouth (objects held far from the
  # camera are only a few pixels in the full 640 px frame). ~1 extra detector call per person.
  roi_zoom: true
  roi_skip_resolved: true   # skip the extra pass when a confident held mask is already near the mouth
  roi_budget_per_frame: 1   # at most one optional crop pass; rotate people to avoid starvation
  roi_scale: 1.8            # crop side = hands+mouth extent x this
  roi_min_px: 192
  roi_max_frame_frac: 0.5   # skip when the crop would cover most of the frame
  complete_object_coverage: false # COCO excludes coins/pens; never infer their location

quality:
  calibrated: false
  max_hand_object_ratio: 1.5 # hand-to-object distance / hand extent; no fixed pixel radius
  min_face_px: 40
  min_hand_px: 10
  min_mouth_px: 4
  max_yaw_deg: 60
  max_pitch_deg: 45
  max_landmark_jump: 0.35
  min_sharpness: 20
  min_brightness: 40
  max_brightness: 220
  min_mask_px: 16
  min_mask_conf: 0.6
  min_mask_in_box: 0.8
  min_mask_component_fraction: 0.8
  mask_stability_s: 0.1
  max_mask_area_ratio: 2.0
  min_mask_shape_iou: 0.5
  min_candidate_mask_conf: 0.35 # attention (CAUTION) only; never counts toward confirmed danger. Was 0.5; UNTUNED
